<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="50%" stop-color="#ccc"/>
      <stop offset="100%" stop-color="#444"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#666"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>

  <!-- Subtle border -->
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#333" stroke-width="0.5" fill="none"/>

  <!-- Left D -->
  <text x="15" y="50" font-family="'DM Sans', 'Inter', system-ui, sans-serif" font-weight="700" font-size="42" fill="url(#g1)" letter-spacing="-1">D</text>

  <!-- Right D -->
  <text x="32" y="50" font-family="'DM Sans', 'Inter', system-ui, sans-serif" font-weight="700" font-size="42" fill="url(#g2)" letter-spacing="-1">D</text>
</svg>
